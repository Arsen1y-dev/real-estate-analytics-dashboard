<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интерактивный дашборд недвижимости</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --font-sans: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-display: 'Lora', 'Onest', ui-serif, Georgia, 'Times New Roman', serif;
      --ui-bg: #fafafa;
      --ui-surface: #ffffff;
      --ui-border: rgba(24, 24, 27, 0.08);
      --ui-accent: #4f46e5;
      --ui-accent-soft: rgba(79, 70, 229, 0.08);
      font-family: var(--font-sans);
      font-feature-settings: 'tnum' 1, 'lnum' 1;
    }

    [data-theme='dark'] {
      --ui-bg: #09090b;
      --ui-surface: #0c0c0e;
      --ui-border: rgba(255, 255, 255, 0.08);
      --ui-accent: #818cf8;
      --ui-accent-soft: rgba(129, 140, 248, 0.12);
    }

    body {
      font-family: var(--font-sans);
      font-feature-settings: 'tnum' 1, 'lnum' 1;
    }

    .font-display {
      font-family: var(--font-display);
    }

    .font-tabular {
      font-variant-numeric: tabular-nums;
      font-feature-settings: 'tnum' 1, 'lnum' 1;
    }
  </style>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-200 antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
